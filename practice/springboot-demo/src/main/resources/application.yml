server:
  port: 8080

spring:
  application:
    name: springboot-demo
  datasource:
    # H2 内存数据库：随应用启动创建，关闭即销毁，适合练习
    url: jdbc:h2:mem:notesdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
